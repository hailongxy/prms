apiVersion: apps/v1
kind: Deployment
metadata:
  name: prms-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prms-nginx
  template:
    metadata:
      labels:
        app: prms-nginx
    spec:
      containers:
        - name: prms-nginx
          image: prms-nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: prms-nginx-conf
              mountPath: /usr/local/nginx/conf/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: prms-nginx-conf
          configMap:
            name: prms-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: prms-nginx-service
spec:
  type: NodePort
  selector:
    app: prms-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prms-nginx-conf
data:
  nginx.conf: |
    worker_processes 1;

    events {
      worker_connections 1024;
    }

    http {
      include       mime.types;
      default_type  application/octet-stream;
      server {
        listen 80;

        location ^~ /react/ {
          alias /var/www/html/;
          index index.html;
          try_files $uri $uri/ /react/index.html;
        }

        location /api/v1/ {
          proxy_pass http://prms-go-service:8081;
          proxy_set_header Host $host;
          proxy_set_header X-Real_IP $remote_addr;
        }

        location ~ \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
          fastcgi_pass prms-php-service:9000;
          fastcgi_index index.php;
          fastcgi_param SCRIPT_FILENAME /var/www/html/router.php;
          include fastcgi_params;
        }

        location ~ \.php$ {
          fastcgi_pass prms-php-service:9000;
          fastcgi_index index.php;
          fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
          include fastcgi_params;
        }

        location / {
          fastcgi_pass prms-php-service:9000;
          fastcgi_index index.php;
          fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
          include fastcgi_params;
        }
      }
    }
